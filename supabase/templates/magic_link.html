<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#0B0E13;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#F2F5F9">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0B0E13;padding:40px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#10141B;border:1px solid #1E242E;border-radius:16px">
            <tr>
              <td style="padding:36px 32px 12px">
                <p style="margin:0 0 20px;font-family:Georgia,serif;font-size:22px;color:#F2F5F9">Nimbus</p>
                <h1 style="margin:0 0 12px;font-family:Georgia,serif;font-weight:400;font-size:32px;line-height:1.1;color:#F2F5F9">Your login link</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#A3ADBB">Tap below to sign in to Nimbus.</p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#8FC7FF;color:#06111D;text-decoration:none;font-size:15px;font-weight:600;padding:14px 24px;border-radius:12px">Sign in to Nimbus</a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#768091">The link works once and expires in 1 hour. If you didn&rsquo;t ask to sign in, ignore this email.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 28px;font-size:12px;color:#768091">Opportunities, the moment they form.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
