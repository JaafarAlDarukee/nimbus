name: Telegram setup (find chat ID)

# Run by hand after messaging the bot. Lists the chats that have messaged it, so the right
# chat ID can be saved as the TELEGRAM_CHAT_ID secret.
on:
  workflow_dispatch:

jobs:
  find-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List chats that messaged the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/getUpdates"
          updates = json.load(urllib.request.urlopen(url))["result"]
          chats = {}
          for update in updates:
              message = update.get("message") or update.get("channel_post") or update.get("my_chat_member") or {}
              chat = message.get("chat")
              if chat:
                  chats[chat["id"]] = chat.get("title") or chat.get("first_name") or chat.get("username")
          if not chats:
              print("No messages yet: open the bot in Telegram, press Start, then run this again.")
          for chat_id, name in chats.items():
              print(f"CHAT ID {chat_id}  ({name})")
          EOF
