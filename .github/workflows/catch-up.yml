name: Catch-up alerts

# Run by hand after a tagging fix and Reclassify: sends roles from the last few days that the
# personal bot missed (never one already sent). Logs print counts only.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look"
        default: "7"

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  catch-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radar/requirements.txt
      - run: pip install -r radar/requirements.txt
      - name: Send missed roles
        env:
          DAYS: ${{ inputs.days }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m radar.notify.catch_up --days "$DAYS"
