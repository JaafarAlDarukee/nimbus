name: Radar (full, every 6 hours)

# Normally started every 6 hours by Supabase (pg_cron -> workflow_dispatch); this daily GitHub
# schedule is a backup. Keeps the private repo inside GitHub's free 3,000 minutes a month.
on:
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radar/requirements.txt
      - run: pip install -r radar/requirements.txt
      - name: Sync company list
        run: python -m radar.seed
      - name: Scan all boards
        run: python -m radar.run --tier full
