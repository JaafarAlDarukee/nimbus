name: Radar (full, every 4 hours)

# Every 4 hours keeps this private repo inside GitHub's free 3,000 minutes a month.
# When radar/ moves to its own public repo (unlimited minutes) this can run every 2 hours.
on:
  schedule:
    - cron: "27 */4 * * *"
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radar/requirements.txt
      - run: pip install -r radar/requirements.txt
      - name: Sync company list
        run: python -m radar.seed
      - name: Scan all boards
        run: python -m radar.run --tier full
