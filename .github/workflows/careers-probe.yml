name: Careers site probe

# Run by hand: which hiring system each target employer's careers site uses (radar/discover/careers_probe.py).
# Respects robots.txt; logs show employers and public careers URLs only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radar/requirements.txt
      - run: pip install -r radar/requirements.txt
      - name: Probe careers sites
        run: python -m radar.discover.careers_probe
